[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosec-ai"
version = "0.1.0"
description = "Agentic AI framework for automotive cybersecurity assessment"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Trivendra"}
]
dependencies = [
    "openai>=1.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
